<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="citrusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#FF5A00" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Bento Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#citrusGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2" />

  <!-- Monogram C -->
  <path
    d="M 356 170 A 122 122 0 1 0 356 342"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="68"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />
</svg>
